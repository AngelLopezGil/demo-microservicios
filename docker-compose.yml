services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Demo_Password123!
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
  pedidos-api:
    build:
      context: .
      dockerfile: src/Pedidos/Pedidos.Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PedidosDb=Server=sqlserver,1433;Database=PedidosDb;User Id=sa;Password=Demo_Password123!;TrustServerCertificate=True
      - ConnectionStrings__ServiceBus=${SERVICEBUS_CONNECTION}
    depends_on:
      - sqlserver
    restart: unless-stopped
  inventario-api:
    build:
      context: .
      dockerfile: src/Inventario/Inventario.Api/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__InventarioDb=Server=sqlserver,1433;Database=InventarioDb;User Id=sa;Password=Demo_Password123!;TrustServerCertificate=True
      - ConnectionStrings__ServiceBus=${SERVICEBUS_CONNECTION}
    depends_on:
      - sqlserver
    restart: unless-stopped
  notificaciones-worker:
    build:
      context: .
      dockerfile: src/Notificaciones/Notificaciones.Worker/Dockerfile
    environment:
      - ConnectionStrings__ServiceBus=${SERVICEBUS_CONNECTION}
      - ConnectionStrings__Email=${EMAIL_CONNECTION}
      - Email__Remitente=${EMAIL_REMITENTE}
      - Email__Destinatario=${EMAIL_DESTINATARIO}
    restart: unless-stopped

volumes:
  sqldata: